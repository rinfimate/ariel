[package]
name = "mermaid_wrapper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = "0.31"
ariel-rs = { git = "https://github.com/rinfimate/ariel-rs" }
thiserror = "2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
